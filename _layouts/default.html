<!doctype html>
<html lang="{{ page.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#ffffff">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" href="{{ '/assets/images/diego-illustration.jpg' | relative_url }}" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
    <script>
      try {
        const theme = localStorage.getItem("preferred-theme");
        if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div class="page-shell">
      {% include header.html %}

      <main class="blog-main">
        {{ content }}
      </main>

      {% include footer.html %}
    </div>

    <script src="{{ '/script.js' | relative_url }}"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </body>
</html>
