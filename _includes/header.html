<header class="site-header" data-header>
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Voltar ao início">
    <span class="brand-mark"><img src="{{ '/assets/images/diego-illustration.jpg' | relative_url }}" alt="" aria-hidden="true"></span>
    <span class="brand-copy"><strong>Diego Pereira</strong><small>Engenharia de software · pesquisa</small></span>
  </a>

  <nav class="main-nav" id="main-nav" aria-label="Navegação principal">
    <a href="{{ '/' | relative_url }}" data-nav-link>Início</a>
    <a href="{{ '/blog/' | relative_url }}" data-nav-link>Blog</a>
    <a href="{{ '/#pesquisa' | relative_url }}" data-nav-link>Pesquisa</a>
    <a href="{{ '/#aplicativos' | relative_url }}" data-nav-link>Aplicativos</a>
    <a href="{{ '/#contato' | relative_url }}" data-nav-link>Contato</a>
  </nav>

  <div class="header-actions">
    <div class="language-switcher" role="group" aria-label="Idioma">
      <a class="language-option" href="{{ '/en/' | relative_url }}" data-language-choice="en" lang="en-US">EN</a>
      <a class="language-option is-active" href="{{ '/' | relative_url }}" data-language-choice="pt" lang="pt-BR" aria-current="page">PT</a>
    </div>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Ativar tema escuro" title="Ativar tema escuro">
      <ion-icon class="icon-moon" name="moon-outline" aria-hidden="true"></ion-icon>
      <ion-icon class="icon-sun" name="sunny-outline" aria-hidden="true"></ion-icon>
    </button>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" data-menu-toggle>
      <span></span><span></span><span></span>
      <span class="sr-only">Abrir menu</span>
    </button>
  </div>
</header>
